<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Style.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="qz-hero">
    <div class="container">
        <h1>Quiz Zone</h1>
        <p th:text="'Pick a topic, choose your difficulty, and test yourself — ' + ${totalQuizzes} + ' quizzes and counting.'"></p>

        <form class="qz-search-form d-flex" action="/quiz/join" method="get">
            <input type="text" name="q" class="form-control" placeholder="Search quizzes... e.g. Java, GK, Math">
            <button type="submit"><i class="bi bi-search"></i></button>
        </form>
    </div>
</div>

<div class="container my-5">

    <h4 class="qz-section-title">Browse by Topic</h4>

    <div class="row g-3">
        <div th:each="cat : ${categories}" class="col-6 col-md-3">
            <a th:href="@{/quiz/join(category=${cat.name})}" class="qz-category-card">
                <i class="bi qz-icon" th:classappend="${cat.icon}"></i>
                <h5 th:text="${cat.name}"></h5>
                <small th:text="${cat.quizCount} + ' quizzes'"></small>
            </a>
        </div>

        <div th:if="${#lists.isEmpty(categories)}" class="col-12">
            <div class="alert alert-warning">
                No quizzes found yet. Add JSON files under <code>resources/quizzes/</code> and restart.
            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <a href="/quiz/join" class="btn qz-btn-primary btn-lg px-4">View All Quizzes</a>
    </div>

</div>

</body>
</html>
