<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Error - Quiz Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/Style.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 text-center">
    <div class="card qz-quiz-card p-5">
        <h2 class="text-danger mb-3">⚠️ Something went wrong</h2>
        <p class="mb-4" th:text="${error}">Quiz not found</p>
        <a href="/quiz/join" class="btn qz-btn-primary">Back to Quizzes</a>
    </div>
</div>

</body>
</html>
