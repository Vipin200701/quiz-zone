<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${selectedCategory} != null ? ${selectedCategory} + ' Quizzes - Quiz Zone' : 'Browse Quizzes - Quiz Zone'">Browse Quizzes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Style.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-4">

    <!-- Search bar -->
    <form class="d-flex mb-4" action="/quiz/join" method="get" style="max-width: 480px;">
        <input type="text" name="q" class="form-control me-2" placeholder="Search quizzes..." th:value="${query}">
        <button type="submit" class="btn qz-btn-primary"><i class="bi bi-search"></i></button>
    </form>

    <!-- Category chips -->
    <div class="mb-4">
        <a href="/quiz/join" class="qz-chip" th:classappend="${selectedCategory == null and query == null} ? 'active' : ''">All</a>
        <a th:each="cat : ${allCategories}"
           th:href="@{/quiz/join(category=${cat})}"
           class="qz-chip"
           th:classappend="${selectedCategory != null and #strings.equalsIgnoreCase(selectedCategory, cat)} ? 'active' : ''"
           th:text="${cat}"></a>
    </div>

    <!-- SEARCH RESULTS VIEW -->
    <div th:if="${searchResults != null}">
        <h4 class="qz-section-title" th:text="'Results for \'' + ${query} + '\''"></h4>

        <div th:if="${#lists.isEmpty(searchResults)}" class="alert alert-warning">
            No quizzes matched your search. Try a different keyword.
        </div>

        <div class="row">
            <div th:each="quiz : ${searchResults}" class="col-md-4 mb-3">
                <div class="card qz-quiz-card h-100">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${quiz.title}"></h5>
                        <p class="card-text text-muted mb-1" th:text="${quiz.category}"></p>
                        <p class="card-text mb-3">
                            <span class="qz-badge-difficulty" th:text="${quiz.difficulty}"></span>
                            <span class="ms-2 text-muted" th:text="${quiz.questions.size()} + ' questions'"></span>
                        </p>
                        <a th:href="@{'/quiz/start/' + ${quiz.id}}" class="btn qz-btn-primary mt-auto">Start Quiz</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- GROUPED VIEW (all quizzes, or filtered to one category) -->
    <div th:if="${searchResults == null}">

        <h4 class="qz-section-title" th:text="${selectedCategory} != null ? ${selectedCategory} : 'All Quizzes'"></h4>

        <div th:if="${#maps.isEmpty(groupedQuizzes)}" class="alert alert-warning">
            No quizzes found. Add JSON files under <code>resources/quizzes/</code>.
        </div>

        <div th:each="group : ${groupedQuizzes}" class="mb-4">

            <h6 class="text-muted mb-3" th:text="${group.key}"></h6>

            <div class="row">
                <div th:each="quiz : ${group.value}" class="col-md-4 mb-3">
                    <div class="card qz-quiz-card h-100">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${quiz.title}"></h5>
                            <p class="card-text mb-3">
                                <span class="qz-badge-difficulty" th:text="${quiz.difficulty}"></span>
                                <span class="ms-2 text-muted" th:text="${quiz.questions.size()} + ' questions'"></span>
                            </p>
                            <a th:href="@{'/quiz/start/' + ${quiz.id}}" class="btn qz-btn-primary mt-auto">Start Quiz</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
