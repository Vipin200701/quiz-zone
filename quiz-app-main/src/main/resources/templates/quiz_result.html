<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Result - Quiz Zone</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/Style.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 text-center">
    <div class="card qz-quiz-card p-5">

        <h2 class="text-success mb-3">Quiz Completed 🎉</h2>
        <p class="text-muted" th:if="${quizTitle}" th:text="${quizTitle}"></p>

        <h4>Your Score</h4>
        <h1 style="color: var(--qz-green-dark);">
            <span th:text="${score}"></span> / <span th:text="${total}"></span>
        </h1>

        <div class="d-flex gap-3 justify-content-center mt-4">
            <a href="/quiz/join" class="btn qz-btn-primary">Try Another Quiz</a>
            <a href="/" class="btn btn-outline-secondary">Go to Home</a>
        </div>
    </div>
</div>

</body>
</html>
